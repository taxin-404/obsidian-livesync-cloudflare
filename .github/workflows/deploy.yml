name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:storage

      - name: Write deployment secret
        env:
          COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD }}
        run: |
          if [ -z "$COUCHDB_PASSWORD" ]; then
            echo "Missing COUCHDB_PASSWORD repository secret" >&2
            exit 1
          fi
          printf 'COUCHDB_PASSWORD=%s\n' "$COUCHDB_PASSWORD" > .dev.vars
          chmod 600 .dev.vars

      - name: Deploy storage Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-storage.mjs wrangler.jsonc "" --secrets-file .dev.vars

      - name: Remove secret file
        if: always()
        run: rm -f .dev.vars
